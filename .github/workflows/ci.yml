# The same checks AGENTS.md asks for before a commit. Lint, typecheck and unit tests need
# nothing. The build and browser tests prerender pages from the production database, so they
# run only if the public (anon, RLS-bound) URL and key are set as repository secrets, and are
# skipped otherwise. No service-role key here: CI never writes.
name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://portfolio-pi-weld-92.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build and browser tests (only with Supabase secrets)
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npm run build && npx playwright install --with-deps chromium && npm run test:e2e
      - name: Keep the browser test report
        if: ${{ !cancelled() && env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
